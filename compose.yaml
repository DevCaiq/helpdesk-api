services:
  api:
    build: .
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SQLITE_PATH: /data/db.sqlite3
    volumes:
      - sqlite-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  sqlite-data:
