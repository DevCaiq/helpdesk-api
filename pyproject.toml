[project]
name = "gestao-chamados"
version = "0.1.0"
description = "API REST de gestão de chamados com SLA e atendimento N1/N2"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16,<4",
    "djangorestframework-simplejwt>=5.5,<6",
    "drf-spectacular>=0.28,<1",
    "django-filter>=25,<26",
    "django-environ>=0.12,<1",
    "psycopg[binary]>=3.2,<4",
    "gunicorn>=23,<24; sys_platform != 'win32'",
    "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-django>=4.11,<5",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "freezegun>=1.5,<2",
    "factory-boy>=3.3,<4",
    "bandit>=1.8,<2",
    "pip-audit>=2.9,<3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".agents", ".tools", ".uv-cache", ".venv"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
