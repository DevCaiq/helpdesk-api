name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        settings: [config.settings.test, config.settings.test_postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: helpdesk
          POSTGRES_USER: helpdesk
          POSTGRES_PASSWORD: helpdesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U helpdesk -d helpdesk"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: ${{ matrix.settings }}
      DATABASE_URL: postgres://helpdesk:helpdesk@localhost:5432/helpdesk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.13.8
      - run: uv sync --frozen
      - run: uv run ruff check apps config tests scripts manage.py
      - run: uv run ruff format --check apps config tests scripts manage.py
      - run: uv run pytest --cov=apps --cov-report=term-missing --cov-fail-under=85
      - run: uv run python manage.py check
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run python manage.py spectacular --validate --fail-on-warn --file /dev/null
      - run: uv run bandit -q -r apps config -x apps/usuarios/migrations,apps/auditoria/migrations,apps/chamados/migrations,apps/sla/migrations,apps/demo/migrations
      - run: uv run pip-audit --local
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t helpdesk-api:ci .
  postman:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install uv==0.13.8
      - run: uv sync --frozen
      - run: npm install --prefix .tools-node --no-save --package-lock=false --ignore-scripts --cache .npm-cache newman@6.2.3
      - run: uv run python scripts/smoke_postman.py
