          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      summary: Entrar com e-mail e senha
      tags:
      - Autenticação
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              examples:
                ParDeTokens:
                  value:
                    access: <access>
                    refresh: <refresh>
                  summary: Par de tokens
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: Exige access Bearer. O access existente continua válido até expirar.
      summary: Revogar o refresh do usuário autenticado
      tags:
      - Autenticação
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Logout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Logout'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      description: Retorna novo access e refresh; o refresh anterior não pode ser
        reutilizado.
      summary: Renovar e rotacionar tokens
      tags:
      - Autenticação
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Refresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Refresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Refresh'
        required: true
      responses:
