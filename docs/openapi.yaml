openapi: 3.0.3
info:
  title: Gestão de Chamados API
  version: 0.1.0
paths:
  /api/v1/alertas/:
    get:
      operationId: v1_alertas_list
      summary: Consultar alertas históricos de SLA
      parameters:
      - in: query
        name: chamado
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      - in: query
        name: tipo
        schema:
          type: string
          enum:
          - CRITICO_SEM_RESPONSAVEL
          - PRIMEIRA_RESPOSTA_EM_RISCO
          - RESOLUCAO_EM_RISCO
        description: |-
          * `CRITICO_SEM_RESPONSAVEL` - Crítico sem responsável
          * `RESOLUCAO_EM_RISCO` - Resolução em risco
          * `PRIMEIRA_RESPOSTA_EM_RISCO` - Primeira resposta em risco
      - in: query
        name: triagem_pendente
        schema:
          type: boolean
      tags:
      - Alertas
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlertaList'
          description: ''
  /api/v1/auditoria/:
    get:
      operationId: v1_auditoria_list
      description: Somente leitura, paginado20/máximo100, ordem -criado_em,-id. Intervalo
        [inicio,fim) com fuso; sistema=true filtra ator nulo.
      summary: Consultar auditoria (Gestor)
      parameters:
      - in: query
        name: acao
        schema:
          type: string
          maxLength: 60
          minLength: 1
      - in: query
        name: ator
        schema:
          type: integer
          minimum: 1
      - in: query
        name: entidade
        schema:
          type: string
          maxLength: 60
          minLength: 1
      - in: query
        name: entidade_id
        schema:
          type: string
          maxLength: 50
          minLength: 1
      - in: query
        name: fim
        schema:
          type: string
          format: date-time
        description: Fim exclusivo, ISO8601 com fuso ou Z.
      - in: query
        name: inicio
        schema:
          type: string
          format: date-time
        description: Início inclusivo, ISO8601 com fuso ou Z.
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: page_size
        schema:
          type: integer
          minimum: 1
      - in: query
        name: sistema
        schema:
          type: boolean
      tags:
      - Auditoria
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLogAuditoriaList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
          description: ''
  /api/v1/auditoria/{id}/:
    get:
      operationId: v1_auditoria_retrieve
      summary: Consultar evento de auditoria (Gestor)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Auditoria
      security:
