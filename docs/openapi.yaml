components:
  schemas:
    AbrirChamado:
      type: object
      properties:
        titulo:
          type: string
          maxLength: 200
        descricao:
          type: string
          maxLength: 10000
        categoria:
          type: integer
        impacto:
          $ref: '#/components/schemas/ImpactoEnum'
        urgencia:
          $ref: '#/components/schemas/UrgenciaEnum'
      required:
      - categoria
      - descricao
      - impacto
      - titulo
      - urgencia
    Alerta:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        chamado:
          type: integer
          readOnly: true
        ciclo:
          type: integer
          readOnly: true
        tipo:
          allOf:
          - $ref: '#/components/schemas/TipoAlertaEnum'
          readOnly: true
        triagem_pendente:
          type: boolean
          readOnly: true
        criado_em:
          type: string
          format: date-time
          readOnly: true
      required:
      - chamado
      - ciclo
      - criado_em
      - id
      - tipo
      - triagem_pendente
    Cadastro:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        nome:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
          maxLength: 128
      required:
      - email
      - nome
      - password
    Categoria:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          readOnly: true
        ativa:
          type: boolean
          readOnly: true
      required:
      - ativa
      - id
      - nome
    CategoriaEntrada:
      type: object
      properties:
        nome:
          type: string
          maxLength: 100
        ativa:
          type: boolean
      required:
      - nome
    Chamado:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        titulo:
          type: string
          readOnly: true
        descricao:
          type: string
          readOnly: true
        categoria:
          type: integer
          readOnly: true
        solicitante:
          type: integer
          readOnly: true
        responsavel:
          type: integer
          readOnly: true
          nullable: true
        impacto:
          allOf:
          - $ref: '#/components/schemas/ImpactoEnum'
          readOnly: true
        urgencia:
          allOf:
          - $ref: '#/components/schemas/UrgenciaEnum'
          readOnly: true
        prioridade:
          allOf:
          - $ref: '#/components/schemas/PrioridadeEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusChamadoEnum'
          readOnly: true
        nivel_atual:
          allOf:
          - $ref: '#/components/schemas/NivelAtualEnum'
          readOnly: true
        aberto_em:
          type: string
          format: date-time
          readOnly: true
        primeira_resposta_em:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        prazo_primeira_resposta:
          type: string
          format: date-time
          readOnly: true
        resolvido_em:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        fechado_em:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        ciclos:
          type: array
          items:
            $ref: '#/components/schemas/Ciclo'
          readOnly: true
        sla:
          allOf:
          - $ref: '#/components/schemas/Sla'
          readOnly: true
        sla_status:
          type: string
          readOnly: true
        triado_em:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        triado_por:
          type: integer
          readOnly: true
          nullable: true
      required:
      - aberto_em
      - categoria
      - ciclos
      - descricao
      - fechado_em
      - id
      - impacto
      - nivel_atual
      - prazo_primeira_resposta
      - primeira_resposta_em
      - prioridade
      - resolvido_em
      - responsavel
      - sla
      - sla_status
      - solicitante
      - status
      - titulo
      - triado_em
      - triado_por
      - urgencia
    Ciclo:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        inicio:
          type: string
          format: date-time
          readOnly: true
        prazo:
          type: string
          format: date-time
          readOnly: true
        minutos_aplicados:
          type: integer
          readOnly: true
        prioridade:
          allOf:
          - $ref: '#/components/schemas/PrioridadeEnum'
          readOnly: true
        resolvido_em:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        encerrado_em:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        resultado:
          type: string
          readOnly: true
      required:
      - encerrado_em
      - id
      - inicio
      - minutos_aplicados
      - prazo
      - prioridade
      - resolvido_em
      - resultado
    Comentario:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        autor:
          type: integer
          readOnly: true
        texto:
          type: string
          readOnly: true
        interno:
          type: boolean
          readOnly: true
        criado_em:
          type: string
          format: date-time
          readOnly: true
      required:
      - autor
      - criado_em
      - id
      - interno
      - texto
    ComentarioEntrada:
      type: object
      properties:
        texto:
          type: string
          maxLength: 10000
        interno:
          type: boolean
          default: false
      required:
      - texto
    Equipe:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        nome:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
          maxLength: 128
        perfil:
          $ref: '#/components/schemas/PerfilEquipeEnum'
        nivel:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/NivelEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - email
      - nome
      - password
      - perfil
    Erro:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErroDetalhe'
      required:
      - error
    ErroDetalhe:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details: {}
      required:
      - code
      - details
      - message
    EstadoSlaEnum:
      enum:
      - NO_PRAZO
      - EM_RISCO
      - VENCIDO
      - CUMPRIDO
      - VIOLADO
      - NAO_APLICAVEL
      type: string
      description: |-
        * `NO_PRAZO` - NO_PRAZO
        * `EM_RISCO` - EM_RISCO
        * `VENCIDO` - VENCIDO
        * `CUMPRIDO` - CUMPRIDO
        * `VIOLADO` - VIOLADO
        * `NAO_APLICAVEL` - NAO_APLICAVEL
    Evento:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        tipo:
          allOf:
          - $ref: '#/components/schemas/TipoEventoEnum'
          readOnly: true
        autor:
          type: integer
          readOnly: true
          nullable: true
        motivo:
          type: string
          readOnly: true
        dados:
          readOnly: true
        criado_em:
          type: string
          format: date-time
          readOnly: true
      required:
      - autor
      - criado_em
      - dados
      - id
      - motivo
      - tipo
    GrupoCategoria:
      type: object
      properties:
        categoria_id:
          type: integer
        nome:
          type: string
        total:
          type: integer
      required:
      - categoria_id
      - nome
      - total
    GrupoNivel:
      type: object
      properties:
        nivel:
          type: string
        total:
          type: integer
      required:
      - nivel
      - total
    GrupoPrioridade:
      type: object
      properties:
        prioridade:
          $ref: '#/components/schemas/PrioridadeEnum'
        total:
          type: integer
      required:
      - prioridade
      - total
    GrupoStatus:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusChamadoEnum'
        total:
          type: integer
      required:
      - status
      - total
    Historico:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status_anterior:
          allOf:
          - $ref: '#/components/schemas/StatusChamadoEnum'
          readOnly: true
        status_novo:
          allOf:
          - $ref: '#/components/schemas/StatusChamadoEnum'
          readOnly: true
        autor:
          type: integer
          readOnly: true
          nullable: true
        motivo:
          type: string
          readOnly: true
        criado_em:
          type: string
          format: date-time
          readOnly: true
      required:
      - autor
      - criado_em
      - id
      - motivo
      - status_anterior
      - status_novo
    ImpactoEnum:
      enum:
      - ALTO
      - MEDIO
      - BAIXO
      type: string
      description: |-
        * `ALTO` - Alto
        * `MEDIO` - Médio
        * `BAIXO` - Baixo
    Indicador:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/EstadoSlaEnum'
        percentual_consumido:
          type: number
          format: double
        prazo:
          type: string
          format: date-time
        violado:
          type: boolean
        pausado:
          type: boolean
      required:
      - pausado
      - percentual_consumido
      - prazo
      - status
      - violado
    LogAuditoria:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
