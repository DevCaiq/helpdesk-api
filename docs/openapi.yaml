  /api/v1/chamados/:
    get:
      operationId: v1_chamados_list
      summary: Listar fila visível
      parameters:
      - in: query
        name: aberto_em_ate
        schema:
          type: string
          format: date-time
      - in: query
        name: aberto_em_de
        schema:
          type: string
          format: date-time
      - in: query
        name: categoria
        schema:
          type: integer
      - in: query
        name: nivel_atual
        schema:
          type: string
          enum:
          - N1
          - N2
        description: |-
          * `N1` - N1
          * `N2` - N2
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      - in: query
        name: prioridade
        schema:
          type: string
          enum:
          - ALTA
          - BAIXA
          - CRITICA
          - MEDIA
        description: |-
          * `CRITICA` - Crítica
          * `ALTA` - Alta
          * `MEDIA` - Média
          * `BAIXA` - Baixa
      - in: query
        name: responsavel
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      - in: query
        name: sla_status
        schema:
          type: string
          enum:
          - CUMPRIDO
          - EM_RISCO
          - NAO_APLICAVEL
          - NO_PRAZO
          - VENCIDO
          - VIOLADO
        description: |-
          * `NO_PRAZO` - NO_PRAZO
          * `EM_RISCO` - EM_RISCO
          * `VENCIDO` - VENCIDO
          * `CUMPRIDO` - CUMPRIDO
          * `VIOLADO` - VIOLADO
          * `NAO_APLICAVEL` - NAO_APLICAVEL
      - in: query
        name: solicitante
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ABERTO
          - AGUARDANDO_SOLICITANTE
          - CANCELADO
          - EM_ATENDIMENTO
          - FECHADO
          - REABERTO
          - RESOLVIDO
        description: |-
          * `ABERTO` - Aberto
          * `EM_ATENDIMENTO` - Em atendimento
          * `AGUARDANDO_SOLICITANTE` - Aguardando solicitante
          * `RESOLVIDO` - Resolvido
          * `REABERTO` - Reaberto
          * `FECHADO` - Fechado
          * `CANCELADO` - Cancelado
      tags:
      - Chamados
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedChamadoList'
          description: ''
    post:
      operationId: v1_chamados_create
      summary: Abrir chamado em N1
      tags:
      - Chamados
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbrirChamado'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AbrirChamado'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AbrirChamado'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chamado'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
          description: ''
